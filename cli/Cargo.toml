[package]
name = "stashsphere-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Command line client for StashSphere, built for humans and agents"
license = "AGPL-3.0-only"
publish = false

[[bin]]
name = "stashctl"
path = "src/main.rs"

[dependencies]
# required by the generated client in src/api, see src/api/REQUIRED_DEPS.toml
bytes = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["cookies", "multipart", "query", "rustls", "stream"] }
reqwest-middleware = { version = "0.5", features = ["multipart", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
cookie_store = "0.22"
directories = "6"
reqwest_cookie_store = "0.10"
rpassword = "7"
tokio = { version = "1", features = ["macros", "rt", "time"] }
toml = "1"
url = { version = "2", features = ["serde"] }
